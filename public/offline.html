<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无网络 — S-MAIL</title>
<style>
:root{--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--font:"Google Sans","PingFang SC",system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.c{text-align:center;max-width:360px}
.icon{margin:0 auto 24px;width:80px;height:80px;border-radius:24px;background:#e0e7ff;display:flex;align-items:center;justify-content:center}
.icon svg{width:40px;height:40px;color:var(--blue);opacity:.8}
h1{font-size:20px;font-weight:600;margin-bottom:8px}
p{font-size:14px;color:var(--muted);margin-bottom:32px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
.btn:hover{background:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.status{font-size:12px;color:var(--muted);margin-top:24px}
.status.online{color:#059669}
</style>
</head>
<body>
<div class="c">
<div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg></div>
<h1>无网络连接</h1>
<p>请检查网络设置后重试<br>恢复连接后将自动刷新</p>
<button class="btn" onclick="reconnect()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3"/></svg>重试</button>
<div class="status" id="status">等待网络恢复…</div>
</div>
<script>
function reconnect(){
  const s=document.getElementById('status');
  s.textContent='检查中…';
  fetch('/api/version').then(r=>{
    if(r.ok){s.textContent='已恢复!';s.className='status online';setTimeout(()=>location.reload(),600)}
    else{s.textContent='服务器异常'}
  }).catch(()=>{s.textContent='仍然无法连接';setTimeout(()=>location.reload(),2000)});
}
window.addEventListener('online',()=>{document.getElementById('status').textContent='网络已恢复';setTimeout(()=>location.reload(),400)});
</script>
</body>
</html>
