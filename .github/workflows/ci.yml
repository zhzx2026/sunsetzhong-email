name: 持续集成检查

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: DingTalkGoGoGo/go.sum

      - name: 运行 Go 测试
        working-directory: DingTalkGoGoGo
        run: go test ./...
